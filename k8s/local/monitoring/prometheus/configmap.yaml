# Task: T-G005 — Prometheus ConfigMap (scrape config + alert rules)
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      # Dapr sidecar metrics (all services) — 15s
      - job_name: "dapr-sidecars"
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [todo-app]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_enabled]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_dapr_io_metrics_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:9090

      # Application /metrics endpoints — 15s
      - job_name: "app-metrics"
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names: [todo-app]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: (task-api|chat-api|reminder-service|recurring-service|audit-service|ws-sync-service)
            action: keep
        metrics_path: /metrics

      # Strimzi Kafka broker metrics — 30s (Plan §7.1)
      - job_name: "strimzi-kafka"
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kafka]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
            action: keep
            regex: Kafka
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: ${1}:9404

      # PostgreSQL exporter — 30s (Plan §7.1, local only)
      - job_name: "postgresql"
        scrape_interval: 30s
        static_configs:
          - targets: ["postgres-exporter.todo-app.svc.cluster.local:9187"]

  alerts.yml: |
    groups:
      - name: api_alerts
        rules:
          - alert: HighErrorRate
            expr: >
              sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service)
              / sum(rate(http_requests_total[5m])) by (service)
              > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx error rate on {{ $labels.service }}"
              description: "{{ $labels.service }} has {{ $value | humanizePercentage }} error rate"

          - alert: HighP95Latency
            expr: >
              histogram_quantile(0.95,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
              ) > 1.0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High P95 latency on {{ $labels.service }}"

          - alert: HighP99Latency
            expr: >
              histogram_quantile(0.99,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
              ) > 3.0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Critical P99 latency on {{ $labels.service }}"

      - name: kafka_alerts
        rules:
          - alert: KafkaConsumerLagHigh
            expr: sum(kafka_consumergroup_lag) by (consumergroup, topic) > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kafka consumer lag high for {{ $labels.consumergroup }}"

          - alert: KafkaPublishFailures
            expr: rate(kafka_events_failed_total[5m]) > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Kafka event publish failures on {{ $labels.service }}"

      - name: pod_health_alerts
        rules:
          - alert: PodRestartLoop
            expr: increase(kube_pod_container_status_restarts_total{namespace="todo-app"}[15m]) > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} restarting frequently"

          - alert: PodNotReady
            expr: kube_pod_status_ready{namespace="todo-app", condition="true"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} not ready"

          - alert: HighCPUUsage
            expr: >
              sum(rate(container_cpu_usage_seconds_total{namespace="todo-app"}[5m])) by (pod)
              / sum(kube_pod_container_resource_limits{namespace="todo-app", resource="cpu"}) by (pod)
              > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.pod }}"

          - alert: HighMemoryUsage
            expr: >
              sum(container_memory_usage_bytes{namespace="todo-app"}) by (pod)
              / sum(kube_pod_container_resource_limits{namespace="todo-app", resource="memory"}) by (pod)
              > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.pod }}"

      - name: dapr_alerts
        rules:
          - alert: DaprSidecarUnhealthy
            expr: dapr_health == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Dapr sidecar unhealthy on {{ $labels.app_id }}"

          - alert: DaprInvocationErrors
            expr: rate(dapr_http_server_request_count{status=~"5.."}[5m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Dapr invocation errors on {{ $labels.app_id }}"
