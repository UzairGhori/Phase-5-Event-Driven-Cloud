# Task: T-D006 — WebSocket Sync Service Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-sync-service
  namespace: todo-app
  labels:
    app: ws-sync-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-sync-service
  template:
    metadata:
      labels:
        app: ws-sync-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "ws-sync-service"
        dapr.io/app-port: "8005"
        dapr.io/app-protocol: "http"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
    spec:
      containers:
        - name: ws-sync-service
          image: todo-app/ws-sync-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8005
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets
                  key: secret-key
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: SERVICE_NAME
              value: "ws-sync-service"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: ws-sync-service
  namespace: todo-app
spec:
  selector:
    app: ws-sync-service
  ports:
    - port: 8005
      targetPort: 8005
  type: ClusterIP
