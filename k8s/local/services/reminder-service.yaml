# Task: T-D006 — Reminder Service Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reminder-service
  namespace: todo-app
  labels:
    app: reminder-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reminder-service
  template:
    metadata:
      labels:
        app: reminder-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "reminder-service"
        dapr.io/app-port: "8002"
        dapr.io/app-protocol: "http"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
    spec:
      containers:
        - name: reminder-service
          image: todo-app/reminder-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: SERVICE_NAME
              value: "reminder-service"
            - name: TASK_API_APP_ID
              value: "task-api"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: reminder-service
  namespace: todo-app
spec:
  selector:
    app: reminder-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
