# Task: T-D007 — Minikube NGINX Ingress
# Spec: §17.1
# Plan: §5.1
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-ingress
  namespace: todo-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: ws-sync-service
                port:
                  number: 8005
          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: chat-api
                port:
                  number: 8001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: task-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
