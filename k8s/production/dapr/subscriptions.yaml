# T-C004 — Dapr Subscription manifests for production AKS
# Same subscriptions as local — topic-to-endpoint wiring is environment-agnostic
# Spec: §8.1 | Plan: §3.3, §4.4

# --- Recurring Service: consumes task.completed ---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: recurring-task-completed
  namespace: todo-app
spec:
  pubsubname: pubsub-kafka
  topic: todo.task.completed
  routes:
    default: /events/task-completed
scopes:
  - recurring-service
---
