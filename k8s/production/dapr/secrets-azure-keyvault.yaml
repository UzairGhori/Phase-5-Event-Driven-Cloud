# T-C006 — Dapr secrets store (Azure Key Vault) for production AKS
# Spec: §9.4, FR-041 | Plan: §4.3
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: secrets-store
  namespace: todo-app
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
    - name: vaultName
      value: "todo-app-keyvault"
    - name: azureClientId
      value: ""  # Set via workload identity / managed identity
    - name: azureTenantId
      value: ""  # Set via workload identity / managed identity
