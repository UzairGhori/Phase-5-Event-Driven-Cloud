# T-C005 — Dapr Pub/Sub Kafka component for production (Redpanda Cloud)
# Spec: §9.1, NFR-023 | Plan: §4.1
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub-kafka
  namespace: todo-app
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      secretKeyRef:
        name: kafka-secrets
        key: brokers
    - name: authType
      value: "password"
    - name: saslUsername
      secretKeyRef:
        name: kafka-secrets
        key: sasl-username
    - name: saslPassword
      secretKeyRef:
        name: kafka-secrets
        key: sasl-password
    - name: saslMechanism
      value: "SCRAM-SHA-256"
    - name: initialOffset
      value: "oldest"
    - name: maxMessageBytes
      value: "1048576"
    - name: consumeRetryInterval
      value: "1000ms"
    - name: version
      value: "3.0.0"
auth:
  secretStore: secrets-store
scopes:
  - task-api
  - reminder-service
  - recurring-service
  - audit-service
  - ws-sync-service
