# Task: T-E003 — HPA for WebSocket Sync Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ws-sync-hpa
  namespace: todo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ws-sync-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
