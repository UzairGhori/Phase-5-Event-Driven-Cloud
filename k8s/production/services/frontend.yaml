# Task: T-E002 — Production Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: todo-app
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "frontend"
        dapr.io/app-port: "3000"
        dapr.io/app-protocol: "http"
        dapr.io/enable-metrics: "true"
        dapr.io/metrics-port: "9090"
    spec:
      containers:
        - name: frontend
          image: ghcr.io/todo-app/todo-frontend:IMAGE_TAG
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          env:
            - { name: TASK_API_URL, value: "http://task-api.todo-app.svc.cluster.local:8000" }
            - { name: CHAT_API_URL, value: "http://chat-api.todo-app.svc.cluster.local:8001" }
            - { name: WS_SYNC_URL, value: "ws://ws-sync-service.todo-app.svc.cluster.local:8005" }
          livenessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { memory: "256Mi", cpu: "250m" }, limits: { memory: "512Mi", cpu: "500m" } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: todo-app }
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
