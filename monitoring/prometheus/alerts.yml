# Prometheus Alert Rules — Plan §7.1
# Coverage: API latency, error rates, Kafka lag, pod health, Dapr metrics
groups:
  - name: api_alerts
    rules:
      # High error rate (>5% of requests returning 5xx over 5 minutes)
      - alert: HighErrorRate
        expr: >
          sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service)
          / sum(rate(http_requests_total[5m])) by (service)
          > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has {{ $value | humanizePercentage }} error rate (threshold: 5%)"

      # High P95 latency (>1s over 5 minutes)
      - alert: HighP95Latency
        expr: >
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.service }}"
          description: "{{ $labels.service }} P95 latency is {{ $value | humanizeDuration }} (threshold: 1s)"

      # High P99 latency (>3s over 5 minutes)
      - alert: HighP99Latency
        expr: >
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 3.0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical P99 latency on {{ $labels.service }}"
          description: "{{ $labels.service }} P99 latency is {{ $value | humanizeDuration }} (threshold: 3s)"

  - name: kafka_alerts
    rules:
      # Consumer lag exceeding threshold
      - alert: KafkaConsumerLagHigh
        expr: sum(kafka_consumergroup_lag) by (consumergroup, topic) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag high for {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} has lag of {{ $value }}"

      # Event publish failures
      - alert: KafkaPublishFailures
        expr: rate(kafka_events_failed_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Kafka event publish failures on {{ $labels.service }}"
          description: "{{ $labels.service }} failing to publish to {{ $labels.topic }}: {{ $value | humanize }}/s"

  - name: pod_health_alerts
    rules:
      # Pod restart loop
      - alert: PodRestartLoop
        expr: increase(kube_pod_container_status_restarts_total{namespace="todo-app"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} restarting frequently"
          description: "{{ $labels.pod }} has restarted {{ $value | humanize }} times in 15 minutes"

      # Pod not ready
      - alert: PodNotReady
        expr: >
          kube_pod_status_ready{namespace="todo-app", condition="true"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} not ready"
          description: "{{ $labels.pod }} has been not ready for 5 minutes"

      # High CPU usage (>80% of limit)
      - alert: HighCPUUsage
        expr: >
          sum(rate(container_cpu_usage_seconds_total{namespace="todo-app"}[5m])) by (pod)
          / sum(kube_pod_container_resource_limits{namespace="todo-app", resource="cpu"}) by (pod)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.pod }}"
          description: "{{ $labels.pod }} using {{ $value | humanizePercentage }} of CPU limit"

      # High memory usage (>85% of limit)
      - alert: HighMemoryUsage
        expr: >
          sum(container_memory_usage_bytes{namespace="todo-app"}) by (pod)
          / sum(kube_pod_container_resource_limits{namespace="todo-app", resource="memory"}) by (pod)
          > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.pod }}"
          description: "{{ $labels.pod }} using {{ $value | humanizePercentage }} of memory limit"

  - name: dapr_alerts
    rules:
      # Dapr sidecar unhealthy
      - alert: DaprSidecarUnhealthy
        expr: >
          dapr_health == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Dapr sidecar unhealthy on {{ $labels.app_id }}"
          description: "Dapr sidecar for {{ $labels.app_id }} has been unhealthy for 2 minutes"

      # Dapr service invocation errors
      - alert: DaprInvocationErrors
        expr: >
          rate(dapr_http_server_request_count{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dapr invocation errors on {{ $labels.app_id }}"
          description: "{{ $labels.app_id }} seeing {{ $value | humanize }}/s Dapr invocation errors"
