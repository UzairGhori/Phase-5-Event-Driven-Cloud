# Task: T-C002 — Dapr state store (PostgreSQL, not Redis)
# Spec: §9.2
# Plan: §4.2, §12 (Deviation: PostgreSQL not Redis)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: todo-app
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: db-secrets
        key: connection-string
    - name: tableName
      value: "dapr_state"
    - name: metadataTableName
      value: "dapr_metadata"
    - name: cleanupIntervalInSeconds
      value: "300"
auth:
  secretStore: secrets-store
scopes:
  - reminder-service
  - recurring-service
  - audit-service
