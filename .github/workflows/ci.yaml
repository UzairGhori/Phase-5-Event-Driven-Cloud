# Task: T-F001 — CI workflow (PR gate)
# Spec: §12 US9.1, §3.8
# Plan: §6.2
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/ services/

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci && npm run lint

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: todo_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest
      - run: pytest backend/tests/ -v
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/todo_app

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci && npm test

  docker-build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { file: docker/task-api.Dockerfile, name: task-api }
          - { file: docker/chat-api.Dockerfile, name: chat-api }
          - { file: docker/reminder-service.Dockerfile, name: reminder }
          - { file: docker/recurring-service.Dockerfile, name: recurring }
          - { file: docker/audit-service.Dockerfile, name: audit }
          - { file: docker/ws-sync-service.Dockerfile, name: ws-sync }
          - { file: docker/frontend.Dockerfile, name: frontend }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.service.file }} -t test-${{ matrix.service.name }} .
